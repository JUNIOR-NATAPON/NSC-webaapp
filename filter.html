<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Filter Status</title>

<link rel="stylesheet" href="css/filter.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<div class="phone">

<header>

<a href="dashboard.html">
<i class="fa-solid fa-arrow-left"></i>
</a>

<h2>Filter Status</h2>

<i class="fa-solid fa-filter"></i>

</header>

<div class="filter-card">

<h3>Filter Health</h3>

<div class="progress">

<div class="progress-bar" id="progressBar"></div>

</div>

<h1 id="percent">87%</h1>

<p>Remaining Lifetime</p>

</div>

<div class="grid">

<div class="info">

<h4>Days Left</h4>

<h2 id="daysLeft">36</h2>

</div>

<div class="info">

<h4>Water Filtered</h4>

<h2 id="liters">420 L</h2>

</div>

<div class="info">

<h4>Last Changed</h4>

<h2>10 Jun</h2>

</div>

<div class="info">

<h4>Next Replace</h4>

<h2>16 Jul</h2>

</div>

</div>

<div class="history">

<h3>Maintenance History</h3>

<ul id="historyList">

<li>
<span>10 Jun 2026</span>
<strong>Filter Replaced</strong>
</li>

<li>
<span>28 Apr 2026</span>
<strong>Maintenance</strong>
</li>

<li>
<span>12 Mar 2026</span>
<strong>Cleaning</strong>
</li>

</ul>

</div>

<button id="replaceBtn">

<i class="fa-solid fa-screwdriver-wrench"></i>

Replace Filter

</button>

<nav>

<a href="dashboard.html">

<i class="fa-solid fa-house"></i>

<span>Home</span>

</a>

<a href="turbidity.html">

<i class="fa-solid fa-droplet"></i>

<span>NTU</span>

</a>

<a href="stats.html">

<i class="fa-solid fa-chart-line"></i>

<span>Stats</span>

</a>

<a href="settings.html">

<i class="fa-solid fa-gear"></i>

<span>Settings</span>

</a>

</nav>

</div>

<script src="js/filter.js"></script>

</body>
</html>
